name: Deploy Dashboard to Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "25 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve previous status for recovery notifications
        run: cp data/history.json "$RUNNER_TEMP/nummus-previous-history.json"

      - name: Collect daily snapshot
        id: collect-snapshot
        run: |
          for attempt in 1 2 3; do
            echo "Collection attempt $attempt of 3"
            if npm run collect; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "No publishable snapshot; retrying in 5 minutes"
              sleep 300
            fi
          done
          echo "All collection attempts failed; existing history remains unchanged"
          exit 1
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      - name: Commit snapshot
        id: commit-snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily NUMMUS snapshot"
          file_pattern: data/history.json data/holder-state.json data/snapshots/*.json

      - name: Trigger NUMMUS Aeternitas data update
        continue-on-error: true
        if: steps.commit-snapshot.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.AETERNITAS_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::AETERNITAS_DISPATCH_TOKEN is not configured; skipping downstream update"
            exit 0
          fi

          gh api \
            --method POST \
            repos/Happydao/Nummus.Aeternitas/dispatches \
            -f event_type=nummus_data_updated

      - name: Notify Telegram about unavailable and recovered metrics
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIOUS_HISTORY_PATH: ${{ runner.temp }}/nummus-previous-history.json
          COLLECTION_OUTCOME: ${{ steps.collect-snapshot.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit-snapshot.outcome }}
        run: node scripts/notify-telegram.mjs

  build:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: Verify Pages artifact upload
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Pages artifact upload returned no artifact ID; stopping deployment."
            exit 1
          fi

  deploy:
    # Start only after the upload job has finished, so the artifact is finalized.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for uploaded Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Build did not return a valid Pages artifact ID."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if visible_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"github-pages\" and .expired == false and .id == ${ARTIFACT_ID}) | .id"); then
              if [[ "$visible_id" == "$ARTIFACT_ID" ]]; then
                echo "Confirmed github-pages artifact ${ARTIFACT_ID} in this workflow run."
                exit 0
              fi
            fi
            if [[ "$attempt" -lt 6 ]]; then
              echo "Pages artifact not visible yet; checking again in 10 seconds."
              sleep 10
            fi
          done
          echo "::error::Uploaded Pages artifact ${ARTIFACT_ID} is not available in run ${GITHUB_RUN_ID}; deployment stopped."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
